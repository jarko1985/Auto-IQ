services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autoiq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoiq
    ports:
      - "5432:5432"
    volumes:
      - autoiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoiq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  autoiq_postgres_data:
    name: autoiq_postgres_data
